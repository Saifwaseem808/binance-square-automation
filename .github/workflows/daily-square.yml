name: Daily Binance Square Post

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests google-genai

      - name: Install Binance Square skill
        run: |
          git clone --depth 1 https://github.com/binance/binance-skills-hub.git
          cp -r binance-skills-hub/skills/binance/square-post ./square-post

      - name: Generate and publish
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py
